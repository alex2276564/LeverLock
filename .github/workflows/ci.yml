name: CI Pipeline

# =============================================================================
# WORKFLOW CONFIG
# -----------------------------------------------------------------------------
# PLUGIN_NAME  — human-readable plugin name used for artifacts & releases.
# JAVA_VERSION — JDK version used for build and analysis.
# JAVA_DIST    — JDK distribution.
# =============================================================================
env:
  PLUGIN_NAME: LeverLock
  JAVA_VERSION: '17'
  JAVA_DIST: 'temurin'

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

# A "-caller" suffix keeps this group distinct from any group a called
# reusable workflow builds from "${{ github.workflow }}" on its own side.
concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-renovate:
    name: 🧹 Lint Renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: step-security/setup-bun@v2.1.3
        with:
          bun-version: latest

      - name: Setup Socket Firewall
        uses: socketdev/action@v1.3.2
        with:
          mode: firewall-free

      - name: Validate Renovate Config via Socket Firewall
        run: |
          sfw bunx --package renovate renovate-config-validator --strict

  lint-links:
    name: 🧹 Lint Links
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint Links
        uses: umbrelladocs/action-linkspector@v1.5.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_level: error

  lint-markdown:
    name: 🧹 Lint Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: '**/*.md'
          config: '.markdownlint.jsonc'

  security-scan:
    name: 🔐 Security Scan CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.0
        with:
          languages: java-kotlin
          queries: security-and-quality

      - name: Set up JDK ${{ env.JAVA_VERSION }} (${{ env.JAVA_DIST }})
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build for CodeQL
        run: ./gradlew build -x test

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.0

  security-scan-semgrep:
    name: 🔐 Security Scan Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: security-scans

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'

      - name: Setup Socket Firewall
        uses: socketdev/action@v1.3.2
        with:
          mode: firewall-free

      - name: Install Semgrep via Socket Firewall
        run: sfw pip install semgrep

      - name: Setup Semgrep Pro Engine via Socket Firewall
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: sfw semgrep install-semgrep-pro

      # Exclude mutable action tag rule because Semgrep does not support the modern
      # actions.lockfile mechanism yet.
      - name: Run Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep scan \
            --pro \
            --config auto \
            --config "p/java" \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            --config "p/github-actions" \
            --config "p/supply-chain" \
            --exclude-rule "yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag" \
            --exclude "**/build/**" \
            --exclude "**/.gradle/**" \
            --exclude "**/test/**" \
            --sarif-output semgrep.sarif \
            --error

      - name: Upload results to GitHub Security tab
        # Fix condition to work for both push and PR (excluding forks)
        if: ${{ always() &&
          (github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)) }}
        uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: semgrep.sarif

  security-scan-snyk:
    name: 🔐 Security Scan Snyk (push)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Skip security scan Snyk for PR (for PR we connect GitHub App integration Snyk)
    if: ${{ github.event_name == 'push' }}

    environment: security-scans

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }} (${{ env.JAVA_DIST }})
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/gradle-9-jdk17@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          JAVA_HOME: /opt/java/openjdk # Enforce directory expected by the Snyk container
        with:
          args: --sarif-file-output=snyk.sarif

      - name: Upload Snyk scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.39.0
        if: ${{ always() }}
        with:
          sarif_file: 'snyk.sarif'

  security-scan-trivy:
    name: 🔐 Security Scan Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'

      - name: Run Trivy (console report)
        if: ${{ failure() }}
        run: |
          echo "==== Trivy console report ===="
          trivy fs .

      - name: Upload Trivy scan results to GitHub Security tab
        # Fix condition to work for both push and PR (excluding forks)
        if: ${{ always() &&
          (github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)) }}
        uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: 'trivy-results.sarif'

  security-scan-osv-pr:
    name: 🔐 Security Scan OSV (PR)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}

    permissions:
      contents: read
      actions: read
      security-events: write

    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0
    with:
      fail-on-vuln: true
      scan-args: |-
        --config=osv-scanner.toml
        --recursive
        ./

  security-scan-osv-push:
    name: 🔐 Security Scan OSV (push)
    if: ${{ github.event_name == 'push' }}

    permissions:
      contents: read
      actions: read
      security-events: write

    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      fail-on-vuln: true
      scan-args: |-
        --config=osv-scanner.toml
        --recursive
        ./

  security-scan-jactionlint:
    name: 🔐 Security Scan jactionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run jactionlint (pedantic + online + strict exit)
        uses: jdx/jactionlint@v2.2.0
        with:
          profile: pedantic
          online: strict
          strict-exit: true
          advanced-security: true

  security-scan-supply-chain-guard:
    name: 🔐 Security Scan supply-chain-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: homeofe/supply-chain-guard@v6.5.9
        with:
          fail-on: low
          comment-on-pr: true
          refresh-catalog: true
          exclude-rules: POLICY_SUPPRESSED_SEVERE

  security-scan-gh-actions-lockfile:
    name: 🔐 Security Scan GitHub Actions Lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock extension
        env:
          RETRY_COUNT: 3
          RETRY_DELAY: 30
        run: |
          for i in $(seq 1 "$RETRY_COUNT"); do
            echo "Attempt $i of $RETRY_COUNT to install github/gh-actions-lock..."
            if gh extension install github/gh-actions-lock; then
              echo "Extension installed successfully!"
              exit 0
            fi
          
            if [ "$i" -lt "$RETRY_COUNT" ]; then
              echo "Installation failed. Waiting $RETRY_DELAY seconds before next attempt..."
              sleep "$RETRY_DELAY"
            fi
          done
          
          echo "Error: Failed to install extension after $RETRY_COUNT attempts."
          exit 1

      - name: Verify GitHub Actions lockfile
        run: |
          gh actions-lock --verify

  dependency-review:
    name: 🧩 Dependency Review (PR)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Skip Dependency Review for push
    if: ${{ github.event_name == 'pull_request' }}

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  secrets-scan-trufflehog:
    name: 🔑 Secrets Scan TruffleHog
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Required for diff scan

      - name: TruffleHog Secrets Scan (full)
        if: ${{ github.event_name != 'pull_request' }}
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          path: ./
          extra_args: --results=verified,unknown

      - name: TruffleHog Secrets Scan (diff)
        if: ${{ github.event_name == 'pull_request' }}
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown

  build-pr:
    name: 🏗️ Build Plugin (PR)
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20
    needs: [
      lint-renovate,
      lint-links,
      lint-markdown,
      security-scan,
      security-scan-semgrep,
      security-scan-trivy,
      security-scan-osv-pr,
      security-scan-jactionlint,
      security-scan-supply-chain-guard,
      security-scan-gh-actions-lockfile,
      dependency-review,
      secrets-scan-trufflehog,
    ]
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK ${{ env.JAVA_VERSION }} (${{ env.JAVA_DIST }})
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.PLUGIN_NAME }}
          path: ${{ github.workspace }}/build/libs/
          if-no-files-found: error

  build-push:
    name: 🏗️ Build Plugin (push)
    if: ${{ github.event_name == 'push' }}
    timeout-minutes: 20
    needs: [
      lint-renovate,
      lint-links,
      lint-markdown,
      security-scan,
      security-scan-semgrep,
      security-scan-snyk,
      security-scan-trivy,
      security-scan-osv-push,
      security-scan-jactionlint,
      security-scan-supply-chain-guard,
      security-scan-gh-actions-lockfile,
      secrets-scan-trufflehog
    ]
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK ${{ env.JAVA_VERSION }} (${{ env.JAVA_DIST }})
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.PLUGIN_NAME }}
          path: ${{ github.workspace }}/build/libs/
          if-no-files-found: error
